[package]
name = "archdoc-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
archdoc-core = { path = "../archdoc-core" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
